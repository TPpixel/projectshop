<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.название }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Магазин</a>
            <div class="d-flex">
                <a href="{% url 'product_list' %}" class="btn btn-outline-light">Каталог</a>
                <a href="{% url 'cart_view' %}" class="btn btn-outline-light ms-2">Корзина</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <a href="{% url 'product_list' %}" class="btn btn-outline-secondary mb-3">&larr; Назад</a>
        <div class="row">
            <div class="col-md-6">
                <img src="{{ product.фото_товара.url }}" class="img-fluid" alt="{{ product.название }}">
            </div>
            <div class="col-md-6">
                <h1>{{ product.название }}</h1>
                <p class="text-muted">{{ product.категория.название }} / {{ product.производитель.название }}</p>
                <p class="fs-3 fw-bold text-primary">{{ product.цена }} BYN</p>
                <p>{{ product.описание }}</p>
                <p>В наличии: <strong>{{ product.количество_на_складе }} шт.</strong></p>
                <a href="{% url 'add_to_cart' product.id %}" class="btn btn-success btn-lg">Добавить в корзину</a>
            </div>
        </div>
    </div>
</body>
</html>
