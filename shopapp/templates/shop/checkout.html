{% extends 'base.html' %}
{% load static %}

{% block title %}Оформление заказа — PixelMarket{% endblock %}

{% block content %}
<div class="container my-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Главная</a></li>
            <li class="breadcrumb-item"><a href="{% url 'cart_view' %}">Корзина</a></li>
            <li class="breadcrumb-item active">Оформление</li>
        </ol>
    </nav>

    <h1>Оформление заказа</h1>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <div class="row">
        <div class="col-md-6">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="address" class="form-label">Адрес доставки</label>
                    <textarea name="address" id="address" class="form-control" rows="3" placeholder="Введите адрес доставки" required></textarea>
                </div>
                <button type="submit" class="btn btn-success btn-lg">Подтвердить заказ</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
